name: Deploy production

# Updates PRODUCTION, https://ggnp.gurdevs.com. Its stack keeps the old name
# "NagarKirtan-dev-site" on purpose (see infra/lib/config.ts).
# Production only deploys when started by hand (Actions tab > Deploy production >
# Run workflow) and, once required reviewers are set on the Production
# environment, after approval.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build app
        run: npm run build

      # AWS_DEPLOY_ROLE_ARN may hold the full ARN or just the role name.
      - name: Resolve deploy role
        id: role
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          case "$ROLE" in
            arn:*) arn="$ROLE" ;;
            *) arn="arn:aws:iam::${ACCOUNT//-/}:role/$ROLE" ;;
          esac
          echo "arn=$arn" >> "$GITHUB_OUTPUT"

      # Prints only who GitHub says this run is (no token), to compare with
      # the IAM role's trust policy if sign-in to AWS fails.
      - name: Show GitHub identity sent to AWS
        run: |
          jwt=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$jwt" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{sub, aud, iss}' || true

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          aws-region: us-west-2

      - name: Deploy to AWS
        working-directory: infra
        run: npx cdk deploy NagarKirtan-dev-site --require-approval never --outputs-file cdk-outputs.json

      - name: Show site address
        run: |
          url=$(jq -r '."NagarKirtan-dev-site".SiteUrl' infra/cdk-outputs.json)
          echo "Production site: $url"
          echo "### Production site: $url" >> "$GITHUB_STEP_SUMMARY"
