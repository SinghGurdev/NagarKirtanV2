name: Deploy production

# Production only deploys when started by hand (Actions tab > Deploy production >
# Run workflow) and, once required reviewers are set on the Production
# environment, after approval.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build app
        run: npm run build

      # AWS_DEPLOY_ROLE_ARN may hold the full ARN or just the role name.
      - name: Resolve deploy role
        id: role
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          case "$ROLE" in
            arn:*) arn="$ROLE" ;;
            *) arn="arn:aws:iam::${ACCOUNT//-/}:role/$ROLE" ;;
          esac
          echo "arn=$arn" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          aws-region: us-west-2

      - name: Deploy to AWS
        working-directory: infra
        run: npx cdk deploy NagarKirtan-prod-site --require-approval never --outputs-file cdk-outputs.json

      - name: Show site address
        run: |
          url=$(jq -r '."NagarKirtan-prod-site".SiteUrl' infra/cdk-outputs.json)
          echo "Production site: $url"
          echo "### Production site: $url" >> "$GITHUB_STEP_SUMMARY"
